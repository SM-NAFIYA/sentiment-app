<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis using Machine Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Sentiment Analysis using Machine Learning</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Analyze a review or comment</h5>
                        <textarea id="reviewText" class="form-control mb-3" rows="4"
                            placeholder="Type or paste a customer review, feedback, or comment..."></textarea>
                        <button id="analyzeBtn" class="btn btn-primary">Analyze Sentiment</button>

                        <div id="resultBox" class="mt-4 d-none">
                            <div class="alert" id="resultAlert" role="alert">
                                <strong>Sentiment: </strong><span id="resultLabel"></span>
                                <span id="resultConfidence" class="text-muted"></span>
                            </div>
                        </div>
                        <div id="errorBox" class="mt-3 text-danger d-none"></div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Recent Analyses</h5>
                        <div id="historyList">
                            <p class="text-muted">No history yet -- analyze a review above.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const analyzeBtn = document.getElementById("analyzeBtn");
        const reviewText = document.getElementById("reviewText");
        const resultBox = document.getElementById("resultBox");
        const resultAlert = document.getElementById("resultAlert");
        const resultLabel = document.getElementById("resultLabel");
        const resultConfidence = document.getElementById("resultConfidence");
        const errorBox = document.getElementById("errorBox");
        const historyList = document.getElementById("historyList");

        const alertClass = {
            positive: "alert-success",
            negative: "alert-danger",
            neutral: "alert-secondary",
        };

        const emojiMap = {
            positive: "🤩",
            negative: "🙁",
            neutral: "😐",
        };

        async function analyzeOne(text) {
            const res = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ review_text: text }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Something went wrong.");
            return data;
        }

        function renderResult(text, data) {
            const emoji = emojiMap[data.sentiment] || "";
            const cls = alertClass[data.sentiment] || "alert-info";
            const conf = data.confidence ? ` (confidence: ${data.confidence}%)` : "";
            return `
                <div class="alert ${cls} mb-2">
                    <strong>${emoji} ${data.sentiment.toUpperCase()}</strong>${conf}
                    <div class="small mt-1">${text}</div>
                </div>
            `;
        }

        async function analyze() {
            const rawText = reviewText.value.trim();
            errorBox.classList.add("d-none");
            resultBox.classList.add("d-none");
            resultBox.innerHTML = "";

            // Split into individual reviews, one per non-empty line
            const lines = rawText.split("\n").map(l => l.trim()).filter(l => l.length > 0);

            if (!lines.length) {
                errorBox.textContent = "Please enter some text first.";
                errorBox.classList.remove("d-none");
                return;
            }

            analyzeBtn.disabled = true;
            analyzeBtn.textContent = lines.length > 1
                ? `Analyzing ${lines.length} reviews...`
                : "Analyzing...";

            try {
                let html = "";
                for (const line of lines) {
                    const data = await analyzeOne(line);
                    html += renderResult(line, data);
                }
                resultBox.innerHTML = html;
                resultBox.classList.remove("d-none");

                loadHistory();
            } catch (err) {
                errorBox.textContent = "Could not reach the server.";
                errorBox.classList.remove("d-none");
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = "Analyze Sentiment";
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch("/history");
                const rows = await res.json();
                if (!rows.length) return;

                historyList.innerHTML = rows.map(r => `
                    <div class="border-bottom py-2">
                        <span class="badge ${alertClass[r.sentiment]?.replace('alert-', 'bg-') || 'bg-info'}">${emojiMap[r.sentiment] || ""} ${r.sentiment}</span>
                        <span class="ms-2">${r.review_text}</span>
                    </div>
                `).join("");
            } catch (err) {
                // history is optional (needs MySQL) -- fail quietly
            }
        }

        analyzeBtn.addEventListener("click", analyze);
        loadHistory();
    </script>
</body>
</html>
